<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語練習</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Sans+TC:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="start-container" class="start-container">
        <header class="dashboard-header">
            <div id="total-points-display" class="points-display">
                <!-- Points will be rendered here by JS -->
            </div>
            <nav class="dashboard-nav">
                <button id="admin-add-points-btn" class="icon-button" title="管理員加點" style="opacity: 0.3; filter: grayscale(1);">⚙️</button>
                <button id="show-achievements-btn" class="icon-button" title="我的成就">🏆</button>
                <button id="show-redemptions-btn" class="icon-button" title="我的兌換">🎁</button>
            </nav>
        </header>
        <main class="dashboard-main">

            <div class="start-step">
                <h2>步驟一：選擇練習模式</h2>
                <div class="mode-selection">
                    <button id="mode-btn-spelling" class="start-button secondary" data-mode="spelling">單字拼寫</button>
                    <button id="mode-btn-grammar" class="start-button secondary" data-mode="grammar">文法練習</button>
                </div>
            </div>

            <div class="start-step">
                <h2>步驟二：選擇練習單元</h2>
                <select id="word-list-select" class="word-list-select" disabled></select>
                <div id="unit-rewards-badge-container" class="unit-rewards-badge-container" style="display: none;"></div>
            </div>


            <div class="start-step">
                <button id="start-game-btn" class="start-button" disabled>開始練習</button>
            </div>

            <div class="points-info-container">
                <h3>如何獲得點數？🪙</h3>
                <ul>
                    <li>完成「單字拼寫」或「文法練習」達成各項成就可獲得對應點數。</li>
                    <li>期間限定：通過任一模式第 1、2 回合可獲得 5 點，第 3 回合可獲得 10 點。</li>
                </ul>
            </div>
        </main>
    </div>

    <div id="game-container" class="game-container" style="display: none;">
        <!--
        <header>
            <h1>單字拼寫練習</h1>
        </header>
        --> 

        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="round-display"></div>
        </div>

        <div class="word-area">
            <div id="current-word-display" class="word-display"></div>
            <div class="pronunciation-area">
                <div id="phonetics-display" class="phonetics-display"></div>
                <button id="play-audio-btn" class="play-audio-btn" title="播放發音">🔊</button>
            </div>
            <div id="translation-display" class="translation-display"></div>
            <div id="example-display" class="example-display"></div>
        </div>

        <audio id="word-audio" style="display: none;"></audio>

        <form id="spelling-form" class="spelling-input-area" style="display: none;">
            <input type="text" id="spelling-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="請在此拼寫單字並按 Enter">
        </form>

        <div id="feedback-message" class="feedback-message"></div>

        <div id="health-display" class="health-display">
            <!-- Hearts will be rendered here by JS -->
        </div>
    </div>

    <div id="grammar-container" class="game-container grammar-container" style="display: none;">
        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="grammar-progress-bar"></div>
            </div>
            <div id="grammar-progress-display"></div>
        </div>

        <div class="grammar-meta">
            <span id="grammar-topic-badge" class="grammar-topic-badge"></span>
            <span id="grammar-health-display" class="health-display" aria-label="文法練習剩餘愛心"></span>
        </div>
        <p id="grammar-instruction" class="grammar-instruction"></p>
        <button id="grammar-play-audio-btn" class="grammar-audio-btn" type="button" title="播放英文題目" aria-label="播放英文題目">🔊</button>
        <div id="grammar-question" class="grammar-question"></div>
        <div id="grammar-answer-area" class="grammar-answer-area"></div>
        <div id="grammar-hint" class="grammar-hint" style="display: none;"></div>
        <div id="grammar-feedback" class="feedback-message grammar-feedback"></div>
        <div class="grammar-controls">
            <button id="grammar-hint-btn" class="grammar-button secondary">提示</button>
            <button id="grammar-check-btn" class="grammar-button">檢查答案</button>
            <button id="grammar-next-btn" class="grammar-button" style="display: none;">下一題</button>
        </div>
    </div>

    <div id="completion-container" class="start-container" style="display: none;">
        <h1 class="start-title">恭喜通關！</h1>
        <p style="color: var(--text-secondary); margin-bottom: 2rem;">你已完成本單元的所有練習。</p>
        <button id="restart-btn" class="start-button">再次練習</button>
        <button id="back-to-menu-btn" class="start-button secondary" style="background-color: #a0aec0; margin-top: 10px;">返回主選單</button>
    </div>

    <script src="script.js"></script>

    <!-- Achievement Modal -->
    <div id="achievement-container" style="display: none;">
        <div id="achievement-modal">
            <button id="close-achievements-btn">&times;</button>
            <h2>我的成就</h2>
            <div id="achievement-list"></div>
        </div>
    </div>

    <!-- Redemption Modal -->
    <div id="redemption-container" style="display: none;">
        <div id="redemption-modal">
            <button id="close-redemptions-btn">&times;</button>
            <h2>我的兌換</h2>
            <form id="redemption-form" class="redemption-form">
                <input type="number" id="redeem-points-input" placeholder="兌換點數" required>
                <input type="text" id="redeem-desc-input" placeholder="兌換說明" required>
                <button type="submit">確認兌換</button>
            </form>
            <hr>
            <h3>兌換歷史</h3>
            <ul id="redemption-history-list"></ul>
        </div>
    </div>

    <!-- Flash Overlay for feedback -->
    <div id="flash-overlay"></div>

    <!-- Achievement Toast -->
    <div id="achievement-toast" style="display: none;">
        <div class="toast-icon">🏆</div>
        <div class="toast-text">
            <div class="toast-title">成就解鎖！</div>
            <div class="toast-description"></div>
        </div>
    </div>

    <!-- Admin Password Modal -->
    <div id="admin-modal-container" style="display: none;">
        <div id="admin-password-modal">
            <button id="close-admin-modal-btn">&times;</button>
            <h2>管理員驗證</h2>
            <form id="admin-password-form" class="redemption-form">
                <input type="password" id="admin-password-input" placeholder="請輸入管理員密碼" required>
                <button type="submit">驗證並繼續</button>
            </form>
        </div>
    </div>
</body>
</html>
