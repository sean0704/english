<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="英語練習：單字拼寫、段考特訓與英打練習，搭配點數與成就系統，讓每天的英語練習更有動力。">
    <meta name="theme-color" content="#1a202c">
    <meta name="color-scheme" content="dark">
    <title>英語練習</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 每次開啟都在網址後面加上當下的時間，讓瀏覽器重新下載樣式與程式，
         不會拿舊的快取檔案配新檔案。新增檔案時加進下面對應的清單（程式照清單順序執行）。 -->
    <script>
        (function () {
            var v = Date.now();
            ['style.css', 'trainer.css', 'typing.css'].forEach(function (file) {
                document.write('<link rel="stylesheet" href="' + file + '?v=' + v + '">');
            });
            ['trainer-grading.js', 'trainer-core.js', 'trainer.js', 'typing.js', 'script.js'].forEach(function (file) {
                document.write('<script src="' + file + '?v=' + v + '" defer><\/script>');
            });
        })();
    </script>
    <noscript><link rel="stylesheet" href="style.css"></noscript>
</head>
<body>
    <noscript>
        <p class="noscript-message">本網站需要啟用 JavaScript 才能使用，請在瀏覽器設定中開啟後重新整理。</p>
    </noscript>

    <!-- 常駐總點數、點數紀錄視窗與得點慶祝由 script.js 的 buildPointsUi() 建立 -->

    <!-- 首頁 -->
    <div id="start-container" class="start-container">
        <header class="dashboard-header">
            <div class="dashboard-brand">
                <h1 class="app-title">英語練習</h1>
            </div>
            <nav class="dashboard-nav" aria-label="功能選單">
                <button id="admin-add-points-btn" class="icon-button icon-button-muted" type="button" title="管理員加點" aria-label="管理員加點">⚙️</button>
                <button id="show-achievements-btn" class="icon-button" type="button" title="我的成就" aria-label="我的成就">🏆</button>
                <button id="show-redemptions-btn" class="icon-button" type="button" title="我的兌換" aria-label="我的兌換">🎁</button>
            </nav>
        </header>
        <main class="dashboard-main">
            <div class="start-step">
                <h2 id="mode-step-title">步驟一：選擇練習模式</h2>
                <div class="mode-selection" role="group" aria-labelledby="mode-step-title">
                    <button id="mode-btn-spelling" class="start-button secondary" type="button" data-mode="spelling" aria-pressed="false">單字拼寫</button>
                    <button id="mode-btn-trainer" class="start-button secondary" type="button" data-mode="trainer" aria-pressed="false">段考特訓</button>
                </div>
            </div>

            <div class="start-step">
                <h2 id="unit-step-title">步驟二：選擇練習單元</h2>
                <select id="word-list-select" class="word-list-select" aria-labelledby="unit-step-title" disabled></select>
                <div id="unit-rewards-badge-container" class="unit-rewards-badge-container" style="display: none;"></div>
                <p id="unit-rewards-hint" class="unit-rewards-hint" hidden></p>
            </div>

            <div class="start-step">
                <button id="start-game-btn" class="start-button" type="button" disabled>開始練習</button>
            </div>

            <div class="points-info-container">
                <h3 id="points-info-title">如何獲得點數？🪙</h3>
                <ul id="points-info-list"></ul>
            </div>
        </main>
    </div>

    <!-- 單字拼寫 -->
    <div id="game-container" class="game-container" style="display: none;">
        <div class="progress-wrapper">
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="round-display"></div>
            <button id="spelling-quit-btn" class="quit-button" type="button">離開</button>
        </div>

        <div class="word-area">
            <div id="current-word-display" class="word-display"></div>
            <div class="pronunciation-area">
                <div id="phonetics-display" class="phonetics-display"></div>
                <button id="play-audio-btn" class="play-audio-btn" type="button" title="播放發音" aria-label="播放發音">🔊</button>
            </div>
            <div id="translation-display" class="translation-display"></div>
            <div id="example-display" class="example-display"></div>
        </div>

        <form id="spelling-form" class="spelling-input-area" style="display: none;">
            <input type="text" id="spelling-input" aria-label="拼寫單字" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" placeholder="請在這裡拼出單字">
        </form>

        <div id="feedback-message" class="feedback-message" role="status" aria-live="polite"></div>

        <div id="health-display" class="health-display" aria-label="剩餘愛心"></div>
    </div>

    <!-- 段考特訓（畫面由 trainer.js 產生） -->
    <div id="trainer-container" class="trainer-container" style="display: none;"></div>

    <!-- 結算畫面 -->
    <div id="completion-container" class="start-container completion-container" style="display: none;">
        <div id="completion-icon" class="completion-icon" aria-hidden="true">🎉</div>
        <h1 id="completion-title" class="start-title">恭喜通關！</h1>
        <p id="completion-message" class="completion-message"></p>
        <ul id="completion-stats" class="completion-stats"></ul>
        <div id="completion-review" class="completion-review" hidden>
            <h2 id="completion-review-title" class="completion-review-title"></h2>
            <ul id="completion-review-list" class="completion-review-list"></ul>
        </div>
        <div class="completion-actions">
            <button id="restart-btn" class="start-button" type="button">再次練習</button>
            <button id="back-to-menu-btn" class="start-button secondary" type="button">返回主選單</button>
        </div>
    </div>

    <!-- 成就視窗 -->
    <div id="achievement-container" style="display: none;">
        <div id="achievement-modal" role="dialog" aria-modal="true" aria-labelledby="achievement-modal-title">
            <button id="close-achievements-btn" type="button" aria-label="關閉">&times;</button>
            <h2 id="achievement-modal-title">我的成就</h2>
            <div id="achievement-list"></div>
        </div>
    </div>

    <!-- 兌換視窗 -->
    <div id="redemption-container" style="display: none;">
        <div id="redemption-modal" role="dialog" aria-modal="true" aria-labelledby="redemption-modal-title">
            <button id="close-redemptions-btn" type="button" aria-label="關閉">&times;</button>
            <h2 id="redemption-modal-title">我的兌換</h2>
            <p id="redemption-balance" class="redemption-balance"></p>
            <form id="redemption-form" class="redemption-form" novalidate>
                <input type="number" id="redeem-points-input" aria-label="兌換點數" placeholder="兌換點數" min="1" step="1" inputmode="numeric" required>
                <input type="text" id="redeem-desc-input" aria-label="兌換說明" placeholder="兌換說明" maxlength="60" required>
                <p id="redemption-error" class="form-error" role="alert" hidden></p>
                <button type="submit">確認兌換</button>
            </form>
            <hr>
            <h3>兌換歷史</h3>
            <ul id="redemption-history-list"></ul>
        </div>
    </div>

    <!-- 管理員視窗 -->
    <div id="admin-modal-container" style="display: none;">
        <div id="admin-password-modal" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
            <button id="close-admin-modal-btn" type="button" aria-label="關閉">&times;</button>
            <h2 id="admin-modal-title">管理員驗證</h2>
            <form id="admin-password-form" class="redemption-form" novalidate>
                <input type="password" id="admin-password-input" aria-label="管理員密碼" placeholder="請輸入管理員密碼" autocomplete="off" required>
                <p id="admin-password-error" class="form-error" role="alert" hidden></p>
                <button type="submit">驗證並繼續</button>
            </form>
            <form id="admin-grant-form" class="redemption-form" novalidate hidden>
                <label class="form-field">增加點數
                    <input type="number" id="admin-points-input" min="1" step="1" inputmode="numeric" required>
                </label>
                <label class="form-field">加點原因
                    <input type="text" id="admin-reason-input" maxlength="60" required>
                </label>
                <p id="admin-grant-error" class="form-error" role="alert" hidden></p>
                <button type="submit">確認加點</button>
            </form>
        </div>
    </div>

    <!-- 通用對話框（取代瀏覽器內建的 alert / confirm） -->
    <div id="dialog-container" class="dialog-overlay" style="display: none;">
        <div class="dialog-box" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
            <h2 id="dialog-title" class="dialog-title"></h2>
            <p id="dialog-message" class="dialog-message"></p>
            <div class="dialog-actions">
                <button id="dialog-cancel-btn" class="dialog-button secondary" type="button">取消</button>
                <button id="dialog-confirm-btn" class="dialog-button" type="button">確定</button>
            </div>
        </div>
    </div>

    <!-- 答題回饋閃光 -->
    <div id="flash-overlay" aria-hidden="true"></div>

    <!-- 通知訊息 -->
    <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>
</body>
</html>
